name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Security + syntax + manifest
    runs-on: ubuntu-latest
    steps:
      # Pinned to an immutable commit so every validation run executes the
      # reviewed action revision.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Shellcheck (helper, installer, QR generator)
        run: |
          shellcheck src/omarchy-hotspot-helper src/device-identification.sh src/discover-device.sh src/lease-event.sh install.sh plugin/qr.sh tests/*.sh

      - name: Bash syntax check
        run: |
          bash -n src/omarchy-hotspot-helper src/device-identification.sh src/discover-device.sh src/lease-event.sh install.sh plugin/qr.sh tests/*.sh

      - name: Verify installer payload digests
        run: sha256sum --strict -c payload.sha256

      - name: Python syntax and security tests
        run: |
          python3 -m py_compile plugin/run-bounded.py plugin/copy-secret.py src/secure-state.py src/install-payload.py tests/test_run_bounded.py tests/test_secure_state.py tests/test_install_payload.py
          bash tests/security-hardening-test.sh

      - name: Plugin behavior tests
        run: |
          for test in tests/*-test.sh; do bash "$test"; done

      - name: Validate plugin manifest is valid JSON
        run: |
          python3 -c "import json, pathlib, sys; candidates=[pathlib.Path('manifest.json'), pathlib.Path('plugin/manifest.json')]; found=[p for p in candidates if p.exists()]; assert found, 'no manifest.json found at repo root or plugin/manifest.json'; [json.load(open(p)) for p in found]; print(' '.join(f'{p} OK' for p in found))"

      - name: Validate helper usage
        run: |
          ./src/omarchy-hotspot-helper bogus 2>&1 | grep -q usage || exit 1
          echo "usage guard OK"

      - name: Check polkit rule has no hardcoded user
        run: |
          grep -q '__USER__' config/50-omarchy-hotspot.rules
          ! grep -q 'subject.user == "vagabond"' config/50-omarchy-hotspot.rules
          echo "polkit rule portable OK"
